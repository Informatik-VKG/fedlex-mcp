# HAProxy edge config for fedlex-mcp behind a non-Kubernetes load balancer.
#
# Resolves, when deployed (SCALE-002 / SCALE-003):
#   - Stateful load balancing via a stick-table keyed on the Mcp-Session-Id header
#   - Capacity >= 100k sessions, explicit 24h TTL (correlates with session TTL)
#   - Failover: if a backend is down, the session is re-pinned by the table
#
# Use this only for multi-instance deployments. The default single-instance
# deployment needs no sticky routing.

global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    log global
    option httplog

frontend mcp_frontend
    bind *:8000
    default_backend mcp_backend

backend mcp_backend
    balance roundrobin

    # Stick-table: 100k entries, 24h expiry — pins a session to one backend.
    stick-table type string len 64 size 100k expire 24h

    # Pin on the MCP session header (set by the server on the initialize response).
    stick on req.hdr(Mcp-Session-Id)

    # Health checks so failed backends are removed and sessions re-pinned.
    option httpchk GET /
    default-server check inter 10s fall 3 rise 2

    server mcp1 10.0.0.11:8000
    server mcp2 10.0.0.12:8000
